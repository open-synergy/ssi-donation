        action: "assert"
        target: "release"
        asserts:
          state:
            type: "value"
            expected: "cancel"
          move_id:
            type: "value"
            operator: "is_falsy"

      - step: "Assert Amount Released dropped back to zero"
        action: "assert"
        target: "fund"
        refresh: true
        asserts:
          amount_released:
            type: "value"
            expected: 0.0

