# No shared `setup:` block on purpose. Every scenario in this file runs
# inside the SAME database transaction (odoo-yaml-test replays `setup:`
# in full for every scenario, without a savepoint), so a fixture shared
# via `setup:` would recreate the same unique codes on every replay and
# fail with "Duplicate code" from the second scenario onward. Instead,
# each scenario builds its own self-contained fixture chain with a
# scenario-unique code suffix -- the same pattern already used by
# test_data_donation.yaml in this module.

scenarios:
  - name: "Restriction Release - Full Workflow Posts A Balanced Journal"
    steps:
      - step: "Create the analytic account the fund is bound to"
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic_account"
        values:
          name: "Test Release Analytic R1"

      - step: "Create the fund's own Net Asset Account"
        action: "create"
        model: "account.account"
        save_as: "fund_net_asset_account"
        values:
          name: "Test Release Fund Net Asset R1"
          code: "TRRFNA01"
          user_type_id: "REF: account.data_account_type_non_current_assets"

      - step: "Create the donor-restricted fund"
        action: "create"
        model: "donation_fund"
        save_as: "fund"
        values:
          name: "Test Restricted Fund R1"
          code: "TRRFD01"
          analytic_account_id: "REC: analytic_account.id"
          restriction_type: "with_restriction"
          restriction_note: "Scholarship disbursement only."
          net_asset_account_id: "REC: fund_net_asset_account.id"

      - step: "Record realized usage against the fund"
        action: "create"
        model: "test.donation_fund_consumer_one"
        save_as: "consumer"
        values:
          name: "Doc Release Consumer R1"
          state: "done"
          realized_amount: 100000.0
          donation_fund_id: "REC: fund.id"

      - step: "Assert the fund's Amount Realized reflects the usage"
        action: "assert"
        target: "fund"
        refresh: true
        asserts:
          amount_realized:
            type: "value"
            expected: 100000.0

      - step: "Create the release journal (not Cash/Bank)"
        action: "create"
        model: "account.journal"
        save_as: "release_journal"
        values:
          name: "Test Release Journal R1"
          code: "TRRJ01"
          type: "general"

      - step: "Create the Net Assets Released From Restriction account"
        action: "create"
        model: "account.account"
        save_as: "released_account"
        values:
          name: "Test Net Assets Released R1"
          code: "TRRNAR01"
          user_type_id: "REF: account.data_account_type_non_current_assets"

      - step: "Create the Net Assets Reclassified Without Restriction account"
        action: "create"
        model: "account.account"
        save_as: "reclassified_account"
        values:
          name: "Test Net Assets Reclassified R1"
          code: "TRRNAC01"
          user_type_id: "REF: account.data_account_type_non_current_assets"

      - step: "Create the donation type's own base accounting fields"
        action: "create"
        model: "account.account"
        save_as: "income_account"
        values:
          name: "Test Release Type Income R1"
          code: "TRRIN01"
          user_type_id: "REF: account.data_account_type_revenue"

      - step: "Create the donation type's receivable account"
        action: "create"
        model: "account.account"
        save_as: "receivable_account"
        values:
          name: "Test Release Type Receivable R1"
          code: "TRRRC01"
          user_type_id: "REF: account.data_account_type_receivable"
          reconcile: true

      - step: "Create the donation type's own journal"
        action: "create"
        model: "account.journal"
        save_as: "type_journal"
        values:
          name: "Test Release Type Journal R1"
          code: "TRRTJ01"
          type: "general"

      - step: "Create the donation type, fully configured for release"
        action: "create"
        model: "donation_type"
        save_as: "type"
        values:
          name: "Test Release Type R1"
          code: "TRRTY01"
          journal_id: "REC: type_journal.id"
          income_account_id: "REC: income_account.id"
          receivable_account_id: "REC: receivable_account.id"
          release_journal_id: "REC: release_journal.id"
          net_asset_released_account_id: "REC: released_account.id"
          net_asset_reclassified_account_id: "REC: reclassified_account.id"

      - step: "Create the restriction release"
        action: "create"
        model: "donation_restriction_release"
        save_as: "release"
        values:
          type_id: "REC: type.id"
          fund_id: "REC: fund.id"
          amount: 40000.0
          journal_id: "REC: release_journal.id"
          debit_account_id: "REC: released_account.id"
          credit_account_id: "REC: reclassified_account.id"

      - step: "Assert the release starts in Draft with no move yet"
        action: "assert"
        target: "release"
        asserts:
          state:
            type: "value"
            expected: "draft"
          move_id:
            type: "value"
            operator: "is_falsy"

      - step: "Confirm the release"
        action: "call"
        target: "release"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the release, which also runs Done"
        action: "call"
        target: "release"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Assert the accounting entry was created"
        action: "assert"
        target: "release"
        asserts:
          move_id:
            type: "value"
            operator: "is_truthy"

      - step: "Assert the move has exactly two balanced lines"
        action: "search"
        model: "account.move.line"
        domain: [["move_id", "=", "REC: release.move_id.id"]]
        save_as: "move_lines_1"
        expect_count: 2

      - step: "Assert the fund's Amount Released reflects this release"
        action: "assert"
        target: "fund"
        refresh: true
        asserts:
          amount_released:
            type: "value"
            expected: 40000.0

