# No shared `setup:` block on purpose. Every scenario in this file runs
# inside the SAME database transaction (odoo-yaml-test replays `setup:`
# in full for every scenario, without a savepoint), so a fixture shared
# via `setup:` would recreate the same unique codes on every replay and
# fail with "Duplicate code" from the second scenario onward. Instead,
# each scenario builds its own self-contained fixture chain with a
# scenario-unique code suffix -- the same pattern already used by
# test_data_donation_type.yaml in this module.

options:
  auto_refresh: true

scenarios:
  - name: "Donation - Cash To Unrestricted Fund, Full Workflow"
    steps:
      - step: "Create the analytic account to bind the fund to"
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic_account"
        values:
          name: "Test Donation Analytic D1"

      - step: "Create the fund the donation is received into"
        action: "create"
        model: "donation_fund"
        save_as: "fund"
        values:
          name: "Test Fund D1"
          code: "TDND1"
          analytic_account_id: "REC: analytic_account.id"

      - step: "Create the income account"
        action: "create"
        model: "account.account"
        save_as: "income_account"
        values:
          name: "Test Donation Income D1"
          code: "TDNIN01"
          user_type_id: "REF: account.data_account_type_revenue"

      - step: "Create the receivable account"
        action: "create"
        model: "account.account"
        save_as: "receivable_account"
        values:
          name: "Test Donation Receivable D1"
          code: "TDNRC01"
          user_type_id: "REF: account.data_account_type_receivable"
          reconcile: true

      - step: "Create the cash journal's default account"
        action: "create"
        model: "account.account"
        save_as: "cash_account"
        values:
          name: "Test Donation Cash D1"
          code: "TDNCA01"
          user_type_id: "REF: account.data_account_type_liquidity"

      - step: "Create the journal the donation is posted through"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Test Donation Journal D1"
          code: "TDNJ01"
          type: "general"
          default_account_id: "REC: cash_account.id"

      - step: "Create the donation type"
        action: "create"
        model: "donation_type"
        save_as: "type"
        values:
          name: "Test Donation Type D1"
          code: "TDNTY01"
          journal_id: "REC: journal.id"
          income_account_id: "REC: income_account.id"
          receivable_account_id: "REC: receivable_account.id"

      - step: "Create the donor"
        action: "create"
        model: "res.partner"
        save_as: "donor"
        values:
          name: "Test Donor D1"

      - step: "Create the donation"
        action: "create"
        model: "donation"
        save_as: "donation"
        values:
          partner_id: "REC: donor.id"
          type_id: "REC: type.id"
          fund_id: "REC: fund.id"
          amount: 1000000.0
          receipt_method: "cash"
          journal_id: "REC: journal.id"
          income_account_id: "REC: income_account.id"

      - step: "Assert the debit account follows Cash Received"
        action: "assert"
        target: "donation"
        asserts:
          state:
            type: "value"
            expected: "draft"
          debit_account_id:
            type: "m2o"
            expected: "REC: cash_account"
          move_id:
            type: "value"
            operator: "is_falsy"

      - step: "Confirm the donation"
        action: "call"
        target: "donation"
        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the donation, which also runs Done"
        action: "call"
        target: "donation"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "Assert the accounting entry was created and balanced"
        action: "assert"
        target: "donation"
        asserts:
          move_id:
            type: "value"
            operator: "is_truthy"

      - step: "Assert the move has exactly two balanced lines"
        action: "search"
        model: "account.move.line"
        domain: [["move_id", "=", "REC: donation.move_id.id"]]
        save_as: "move_lines_1"
        expect_count: 2

      - step: "Assert the fund's Amount Received reflects this donation"
        action: "assert"
        target: "fund"
        asserts:
          amount_received:
            type: "value"
            expected: 1000000.0

