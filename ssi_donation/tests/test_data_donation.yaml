      - step: "Create the cancellation reason"
        action: "create"
        model: "base.cancel_reason"
        save_as: "cancel_reason"
        values:
          name: "Test Donation Cancel Reason D5"
          code: "TDNCR05"
          global_use: true

      - step: "Cancel the donation through the cancel reason wizard"
        action: "wizard"
        model: "base.select_cancel_reason"
        target: "donation"
        as_user: "base.user_admin"
        values:
          cancel_reason_id: "REC: cancel_reason"
        method: "action_confirm"
        refresh: true

