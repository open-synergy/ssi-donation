        action: "assert"
        target: "donation"
        asserts:
          state:
            type: "value"
            expected: "cancel"
          move_id:
            type: "value"
            operator: "is_falsy"

      - step: "Assert Amount Received dropped back to zero"
        action: "assert"
        target: "fund"
        asserts:
          amount_received:
            type: "value"
            expected: 0.0

