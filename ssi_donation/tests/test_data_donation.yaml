        action: "search"
        model: "account.move.line"
        domain:
          [
            ["move_id", "=", "REC: donation.move_id.id"],
            ["credit", ">", 0],
            ["analytic_account_id", "=", "REC: analytic_account.id"],
          ]
        save_as: "credit_lines"
        expect_count: 1

      - step: "Assert no debit line carries an analytic account"
        action: "search"
        model: "account.move.line"
        domain:
          [
            ["move_id", "=", "REC: donation.move_id.id"],
            ["debit", ">", 0],
            ["analytic_account_id", "!=", false],
          ]
        save_as: "debit_lines_with_analytic"
        expect_count: 0

