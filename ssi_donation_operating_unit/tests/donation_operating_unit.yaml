# No shared `setup:` block on purpose. `setup:` replays before every
# scenario in the same transaction (no rollback in between), so a shared
# fixture would recreate the same unique codes on every replay and fail
# with "Duplicate code" from the second scenario onward -- the same
# reasoning already documented in ssi_donation/tests/test_data_donation.yaml.
# Each scenario below builds its own self-contained fixture chain with a
# scenario-unique code suffix.

options:
  auto_refresh: true

scenarios:
  - name:
      "Donation done by a user whose default OU differs from the document's still
      propagates the document's OU to the accounting entry"
    steps:
      - step: "Create the analytic account to bind the fund to"
        action: "create"
        model: "account.analytic.account"
        save_as: "analytic_account"
        values:
          name: "Test Donation OU Analytic P1"

      - step: "Create the fund the donation is received into"
        action: "create"
        model: "donation_fund"
        save_as: "fund"
        values:
          name: "Test Donation OU Fund P1"
          code: "TDNOUP1"
          analytic_account_id: "REC: analytic_account.id"

      - step: "Create the income account"
        action: "create"
        model: "account.account"
        save_as: "income_account"
        values:
          name: "Test Donation OU Income P1"
          code: "TDNOUIN1"
          user_type_id: "REF: account.data_account_type_revenue"

      - step: "Create the receivable account"
        action: "create"
        model: "account.account"
        save_as: "receivable_account"
        values:
          name: "Test Donation OU Receivable P1"
          code: "TDNOURC1"
          user_type_id: "REF: account.data_account_type_receivable"
          reconcile: true

      - step: "Create the journal the donation is posted through"
        action: "create"
        model: "account.journal"
        save_as: "journal"
        values:
          name: "Test Donation OU Journal P1"
          code: "TDNOUJ1"
          type: "general"

      - step: "Create the donation type"
        action: "create"
        model: "donation_type"
        save_as: "type"
        values:
          name: "Test Donation OU Type P1"
          code: "TDNOUTY1"
          journal_id: "REC: journal.id"
          income_account_id: "REC: income_account.id"
          receivable_account_id: "REC: receivable_account.id"

      - step: "Create the donor"
        action: "create"
        model: "res.partner"
        save_as: "donor"
        values:
          name: "Test Donor OU P1"

      - step: "Create partner for operating unit A (the document's own OU)"
        action: "create"
        model: "res.partner"
        save_as: "ou_a_partner"
        values:
          name: "Test Donation OU-A Partner P1"

      - step: "Create operating unit A"
        action: "create"
        model: "operating.unit"
        save_as: "ou_a"
        values:
          name: "Test Donation OU-A P1"
          code: "TDNOUA1"
          partner_id: "REC: ou_a_partner.id"

      - step: "Create partner for operating unit B (the acting user's own default OU)"
        action: "create"
        model: "res.partner"
        save_as: "ou_b_partner"
        values:
          name: "Test Donation OU-B Partner P1"

      - step: "Create operating unit B"
        action: "create"
        model: "operating.unit"
        save_as: "ou_b"
        values:
          name: "Test Donation OU-B P1"
          code: "TDNOUB1"
          partner_id: "REC: ou_b_partner.id"

      - step:
          "Create a user whose own default operating unit is B, member of the workflow
          groups needed to confirm and approve"
        action: "create"
        model: "res.users"
        save_as: "ou_b_user"
        values:
          name: "Donation OU-B User P1"
          login: "donation_ou_b_user_p1"
          default_operating_unit_id: "REC: ou_b.id"
          assigned_operating_unit_ids:
            - - 6
              - 0
              - - "REC: ou_b.id"
          groups_id:
            - - 6
              - 0
              - - "REF: base.group_user"
                - "REF: ssi_donation.donation_user_group"
                - "REF: ssi_donation.donation_validator_group"

      - step: "Create the donation, scoped to operating unit A, as that user"
        action: "create"
        model: "donation"
        save_as: "donation"
        as_user: "ou_b_user"
        values:
          partner_id: "REC: donor.id"
          type_id: "REC: type.id"
          fund_id: "REC: fund.id"
          operating_unit_id: "REC: ou_a.id"
          amount: 300000.0
          receipt_method: "cash"
          journal_id: "REC: journal.id"
          income_account_id: "REC: income_account.id"

      - step: "The donation defaults its own OU to the explicit value, not B"
        action: "assert"
        target: "donation"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: ou_a"

      - step: "Confirm the donation as that same user"
        action: "call"
        target: "donation"
        method: "action_confirm"
        as_user: "ou_b_user"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the donation, which also runs Done, as that same user"
        action: "call"
        target: "donation"
        method: "action_approve_approval"
        as_user: "ou_b_user"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "done"

      - step:
          "The generated move header carries operating unit A, not the acting user's own
          default (B)"
        action: "assert"
        target: "donation"
        asserts:
          move_id:
            type: "value"
            operator: "is_truthy"
          move_id.operating_unit_id:
            type: "m2o"
            expected: "REC: ou_a"

      - step: "Both journal items of the move carry operating unit A"
        action: "search"
        model: "account.move.line"
        domain:
          [
            ["move_id", "=", "REC: donation.move_id.id"],
            ["operating_unit_id", "=", "REC: ou_a.id"],
          ]
        save_as: "move_lines_ou_a"
        expect_count: 2

