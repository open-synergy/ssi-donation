        method: "action_confirm"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve the donation, which also runs Done"
        action: "call"
        target: "donation"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        refresh: true
        asserts:
          state:
            type: "value"
            expected: "done"

      - step: "The move exists but carries no operating unit either"
        action: "assert"
        target: "donation"
        asserts:
          move_id:
            type: "value"
            operator: "is_truthy"
          move_id.operating_unit_id:
            type: "value"
            operator: "is_falsy"

      - step: "Neither journal item carries an operating unit"
        action: "search"
        model: "account.move.line"
        domain:
          [
            ["move_id", "=", "REC: donation.move_id.id"],
            ["operating_unit_id", "=", false],
          ]
        save_as: "move_lines_no_ou"
        expect_count: 2

